# /etc/nginx/cpee.d/locations.d/camera
#
# Camera monitoring service – BPM Lab
# Stream endpoints bypass FastAPI and go directly to µStreamer for
# minimum latency (~30–80 ms). All other requests go via FastAPI.
#
# Public URLs:
#   https://lab.bpm.in.tum.de/cameras/healthz
#   https://lab.bpm.in.tum.de/cameras/readyz
#   https://lab.bpm.in.tum.de/cameras/api/v1/cameras/whiteboard/snapshot.jpg
#   https://lab.bpm.in.tum.de/cameras/api/v1/cameras/robot/snapshot.jpg
#   https://lab.bpm.in.tum.de/cameras/api/v1/cameras/whiteboard/stream.mjpeg
#   https://lab.bpm.in.tum.de/cameras/api/v1/cameras/robot/stream.mjpeg
#   https://lab.bpm.in.tum.de/cameras/api/v1/captures  (POST – CPEE)

# ── MJPEG stream – whiteboard direct to µStreamer :8101 ──────────────────────
location /cameras/api/v1/cameras/whiteboard/stream.mjpeg {
  proxy_pass                http://127.0.0.1:8101/?action=stream;
  proxy_http_version        1.1;
  proxy_buffering           off;
  proxy_cache               off;
  proxy_read_timeout        3600s;
  chunked_transfer_encoding on;
}

# ── MJPEG stream – robot direct to µStreamer :8102 ────────────────────────────
location /cameras/api/v1/cameras/robot/stream.mjpeg {
  proxy_pass                http://127.0.0.1:8102/?action=stream;
  proxy_http_version        1.1;
  proxy_buffering           off;
  proxy_cache               off;
  proxy_read_timeout        3600s;
  chunked_transfer_encoding on;
}

# ── All other camera API requests → FastAPI ───────────────────────────────────
location /cameras/ {
  proxy_pass            http://127.0.0.1:8100/;
  proxy_http_version    1.1;
  proxy_set_header      Host              $host;
  proxy_set_header      X-Real-IP         $remote_addr;
  proxy_set_header      X-Forwarded-For   $proxy_add_x_forwarded_for;
  proxy_set_header      X-Forwarded-Proto $scheme;
  proxy_set_header      Connection        "";
  proxy_connect_timeout 5s;
  proxy_read_timeout    30s;
}
