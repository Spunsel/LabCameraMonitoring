# /etc/nginx/cpee.d/locations.d/camera
#
# Camera monitoring service – BPM Lab
# Proxies to FastAPI on 127.0.0.1:8100
#
# Public URLs:
#   https://lab.bpm.in.tum.de/cameras/healthz
#   https://lab.bpm.in.tum.de/cameras/readyz
#   https://lab.bpm.in.tum.de/cameras/api/v1/cameras/whiteboard/snapshot.jpg
#   https://lab.bpm.in.tum.de/cameras/api/v1/cameras/robot/snapshot.jpg
#   https://lab.bpm.in.tum.de/cameras/api/v1/cameras/whiteboard/stream.mjpeg
#   https://lab.bpm.in.tum.de/cameras/api/v1/captures  (POST – CPEE)

# ── MJPEG live stream – buffering must be disabled ────────────────────────────
location ~ ^/cameras/api/v1/cameras/[^/]+/stream\.mjpeg$ {
  rewrite ^/cameras/(.*)$ /$1 break;
  proxy_pass         http://127.0.0.1:8100;
  proxy_http_version 1.1;
  proxy_set_header   Host              $host;
  proxy_set_header   X-Real-IP         $remote_addr;
  proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
  proxy_set_header   X-Forwarded-Proto $scheme;
  proxy_buffering    off;
  proxy_cache        off;
  proxy_read_timeout 3600s;
  chunked_transfer_encoding on;
}

# ── All other camera API requests ─────────────────────────────────────────────
location /cameras/ {
  proxy_pass         http://127.0.0.1:8100/;
  proxy_http_version 1.1;
  proxy_set_header   Host              $host;
  proxy_set_header   X-Real-IP         $remote_addr;
  proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
  proxy_set_header   X-Forwarded-Proto $scheme;
  proxy_set_header   Connection        "";
  proxy_connect_timeout 5s;
  proxy_read_timeout    30s;
}
