# /etc/nginx/conf.d/camera-api.conf
#
# Nginx reverse proxy for the camera service on lab.bpm.in.tum.de.
# Adjust server_name, SSL certificate paths, and auth as appropriate.
#
# This config assumes Nginx is already handling TLS termination for the host.
# Place it inside an existing server{} block or include it as a separate file.

# ── Upstream: FastAPI (camera-api.service) ────────────────────────────────────

upstream camera_api {
    server 127.0.0.1:8100;
    keepalive 8;
}

# ── Server block ──────────────────────────────────────────────────────────────

server {
    listen 443 ssl http2;
    server_name lab.bpm.in.tum.de;

    # SSL – replace with real certificate paths
    ssl_certificate     /etc/ssl/certs/lab.bpm.in.tum.de.crt;
    ssl_certificate_key /etc/ssl/private/lab.bpm.in.tum.de.key;

    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_ciphers         HIGH:!aNULL:!MD5;
    ssl_session_cache   shared:SSL:10m;
    ssl_session_timeout 10m;

    # ── Camera API ────────────────────────────────────────────────────────────

    location /camera-api/ {
        proxy_pass         http://camera_api/;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_set_header   Connection        "";

        # Snapshot timeouts
        proxy_connect_timeout 5s;
        proxy_read_timeout    15s;
        proxy_send_timeout    15s;

        # Rate limiting (define the zone in nginx.conf http{} block)
        # limit_req zone=camera_api burst=20 nodelay;

        # Access logging
        access_log /var/log/nginx/camera-api-access.log combined;
        error_log  /var/log/nginx/camera-api-error.log  warn;
    }

    # ── MJPEG live stream – disable buffering ─────────────────────────────────

    location ~ ^/camera-api/api/v1/cameras/[^/]+/stream\.mjpeg$ {
        proxy_pass         http://camera_api;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;

        # Critical for streaming: disable buffering
        proxy_buffering       off;
        proxy_cache           off;
        proxy_read_timeout    3600s;
        chunked_transfer_encoding on;
    }

    # ── Health endpoint – no auth, allow broader access ───────────────────────
    location /camera-api/healthz {
        proxy_pass http://camera_api/healthz;
        proxy_set_header Host $host;
        access_log off;
    }

    # ── Block µStreamer internal ports from direct public access ──────────────
    # (These are bound to 127.0.0.1 by µStreamer itself, so this is
    #  an extra safety net in case something changes.)
    location ~ ^/(8101|8102)/ {
        deny all;
        return 403;
    }
}

# HTTP → HTTPS redirect
server {
    listen 80;
    server_name lab.bpm.in.tum.de;
    return 301 https://$host$request_uri;
}
