# ── Local development configuration ──────────────────────────────────────────
# Uses MockCameraSource so no physical cameras or µStreamer is required.

cameras:
  whiteboard:
    source: mock
    path: tests/fixtures/whiteboard.jpg   # static JPEG returned for every request

  robot:
    source: mock
    path: tests/fixtures/robot.jpg

ustreamer:
  whiteboard_port: 8101
  robot_port: 8102
  host: "127.0.0.1"

api:
  host: "127.0.0.1"
  port: 8100
  token: ""   # empty = authentication disabled locally

storage:
  captures_dir: var/captures
